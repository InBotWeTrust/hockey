<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Машина и автобус на карте</title><style>*{box-sizing:border-box}body{margin:0;background:#132131;color:#edf4ff;font:14px system-ui}header{padding:14px}h1{font-size:20px;margin:0 0 8px}button{padding:8px 14px;margin:8px 6px 0 0;cursor:pointer}.viewport{height:calc(100dvh - 150px);min-height:430px;overflow:auto hidden;scrollbar-width:none}.world{position:relative;height:100%;width:calc((100dvh - 150px)*3);min-width:1290px;overflow:hidden}.map{height:100%;width:100%;display:block}.vehicle{position:absolute;left:0;bottom:13%;width:3.6%;z-index:1;animation:drive 32s linear infinite;animation-delay:-16s;will-change:transform}.bus{width:7%;bottom:8.5%;z-index:2;animation:drive-back 43s linear infinite;animation-delay:-21.5s}.vehicle img{display:block;width:100%;filter:drop-shadow(0 2px 1px #0008)}.leftward img{transform:scaleX(-1)}@keyframes drive{from{left:-9%}to{left:109%}}@keyframes drive-back{from{left:109%}to{left:-9%}}.paused .vehicle{animation-play-state:paused}.night .vehicle img{filter:brightness(.65) drop-shadow(0 2px 1px #0008)}.lights{display:none;position:absolute;right:0;bottom:27%;width:34%;height:18%;background:linear-gradient(90deg,#fff5ba99,transparent);clip-path:polygon(0 40%,100% 0,100% 100%,0 60%);transform:translateX(95%);filter:blur(2px)}.night .lights{display:block}.leftward .lights{right:auto;left:0;transform:translateX(-95%) scaleX(-1)}.tail{display:none;position:absolute;left:1%;bottom:28%;width:3px;height:3px;background:#f44444;box-shadow:0 0 5px #f22}.night .tail{display:block}.leftward .tail{left:auto;right:1%}@media(prefers-reduced-motion:reduce){.vehicle{animation-play-state:paused}}
.plane{position:absolute;left:-10%;top:7%;width:2.8%;pointer-events:none;display:none;z-index:1}.plane img{width:100%;display:block;position:relative;z-index:1}.plane::before,.plane::after{content:"";position:absolute;right:78%;width:360%;height:1px;pointer-events:none;background:linear-gradient(to right,transparent,rgba(240,247,255,.04) 20%,rgba(240,247,255,.24));filter:blur(.7px);transform-origin:right center;transform:rotate(-1deg);z-index:0}.plane::before{top:52%}.plane::after{top:62%;width:330%;opacity:.65}.night .plane::before,.night .plane::after{opacity:.5}.plane.flying{display:block;animation:plane-flight 55s linear both}@keyframes plane-flight{from{left:-10%}to{left:110%}}.night .plane{filter:brightness(.55)}.paused .plane{animation-play-state:paused}.exhaust{position:absolute;left:0;bottom:15%;width:1px;height:1px;pointer-events:none;z-index:-1}.leftward .exhaust{left:auto;right:0}.exhaust i{position:absolute;right:0;top:0;width:7px;height:4px;border-radius:50%;background:rgba(224,232,238,.32);filter:blur(1.2px);animation:exhaust-puff 1.8s ease-out infinite;--drift:-18px}.exhaust i:nth-child(2){animation-delay:-.6s}.exhaust i:nth-child(3){animation-delay:-1.2s}.leftward .exhaust i{right:auto;left:0;--drift:18px}.paused .exhaust i{animation-play-state:paused}@keyframes exhaust-puff{0%{opacity:0;transform:translate(0,0) scale(.45)}15%{opacity:.45}100%{opacity:0;transform:translate(var(--drift),-5px) scale(2.4)}}@media(prefers-reduced-motion:reduce){.exhaust{display:none}}
.vehicle{animation-name:drive;animation-duration:var(--travel,32s);animation-delay:var(--offset,0s);bottom:var(--lane-bottom);z-index:var(--lane-depth);top:auto}.vehicle.leftward{animation-name:drive-back}.bus{bottom:var(--lane-bottom);z-index:var(--lane-depth)} </style><header><h1>Проба движения по дороге</h1><div>Четыре полосы: две верхние направо, две нижние налево. Разные скорости · карту можно листать. Для проверки проезжают постоянно; редкие появления подключим после согласования.</div><button id="pause">Пауза</button><button id="night">Ночь</button><button id="plane">Самолёт</button><label> Машина <select id="car"></select></label><label> Автобус <select id="bus"></select></label></header><div class="viewport"><div class="world"><div class="plane"><img src="/sprites/city-plane-687338bfb4c3.webp" alt="Самолёт в небе"></div><img class="map" src="/maps/city-day-4096-76504717105e.webp" alt="Карта города"><div class="vehicle"><img src="/sprites/city-traffic-sedan-dd0af97e8395.webp" alt="Серый седан"><i class="lights"></i><i class="tail"></i><span class="exhaust" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="vehicle bus"><img src="/sprites/city-traffic-bus-c393a3566573.webp" alt="Городской автобус"><i class="lights"></i><i class="tail"></i><span class="exhaust" aria-hidden="true"><i></i><i></i><i></i></span></div></div></div><script>const v=document.querySelector('.viewport');v.scrollLeft=(v.firstElementChild.clientWidth-v.clientWidth)/2;document.querySelector('#pause').onclick=e=>{document.body.classList.toggle('paused');e.target.textContent=document.body.classList.contains('paused')?'Продолжить':'Пауза'};document.querySelector('#night').onclick=e=>{const night=document.body.classList.toggle('night');document.querySelector('.map').src=night?'/maps/city-night-4096-658017a820ba.webp':'/maps/city-day-4096-76504717105e.webp';e.target.textContent=night?'День':'Ночь'};document.addEventListener('visibilitychange',()=>{document.querySelectorAll('.vehicle,.exhaust i').forEach(e=>e.style.animationPlayState=document.hidden?'paused':'')});const trafficAssets={"sedan": "/sprites/city-traffic-sedan-dd0af97e8395.webp", "hatchback": "/sprites/city-traffic-hatchback-69c23f5297bb.webp", "wagon": "/sprites/city-traffic-wagon-465a21b1a916.webp", "suv": "/sprites/city-traffic-suv-e71040742ab9.webp", "crossover": "/sprites/city-traffic-crossover-a7388ad71b10.webp", "coupe": "/sprites/city-traffic-coupe-5a95f59708e1.webp", "compact": "/sprites/city-traffic-compact-a1ad5322933c.webp", "executive": "/sprites/city-traffic-executive-4e359c22c166.webp", "taxi": "/sprites/city-traffic-taxi-19afb6e55092.webp", "sedan-blue": "/sprites/city-traffic-sedan-blue-b852f26d7ddc.webp", "bus-red": "/sprites/city-traffic-bus-red-a188ec5bb103.webp", "bus": "/sprites/city-traffic-bus-c393a3566573.webp"};const cars=[['sedan','Серый седан'],['hatchback','Красный хэтчбек'],['wagon','Синий универсал'],['suv','Белый внедорожник'],['crossover','Бордовый кроссовер'],['coupe','Графитовое купе'],['compact','Компактная городская'],['executive','Чёрный седан'],['taxi','Такси'],['sedan-blue','Голубой седан']];const buses=[['bus','Сине-белый'],['bus-red','Красно-кремовый']];for(const [id,items,selector] of [['car',cars,'.vehicle:not(.bus) img'],['bus',buses,'.bus img']]){const select=document.getElementById(id);for(const [key,name] of items){const option=document.createElement('option');option.value=key;option.textContent=name;select.append(option)}select.onchange=()=>(document.querySelector(selector)?document.querySelector(selector).src=trafficAssets[select.value]:null)}const world=document.querySelector('.world');const template=document.querySelector('.vehicle').cloneNode(true);document.querySelectorAll('.vehicle').forEach(e=>e.remove());const lanes=[19.5,17,13,8.5];function setModel(e,key){e.classList.toggle('bus',key.startsWith('bus'));e.querySelector('img').src=trafficAssets[key];e.querySelector('img').alt=key.startsWith('bus')?'Городской автобус':'Легковая машина';e.dataset.model=key}function randomModel(){const list=Math.random()<.18?buses:cars;return list[Math.floor(Math.random()*list.length)][0]}lanes.forEach((bottom,index)=>{const e=template.cloneNode(true);e.classList.toggle('leftward',index>=2);e.dataset.lane=String(index+1);e.style.setProperty('--lane-bottom',bottom+'%');e.style.setProperty('--lane-depth',String(index+2));const duration=28+Math.random()*22;e.style.setProperty('--travel',duration+'s');e.style.setProperty('--offset',(-duration*(.42+index*.035))+'s');setModel(e,index===1||index===3?buses[index===1?0:1][0]:cars[index===0?0:8][0]);e.addEventListener('animationiteration',()=>{setModel(e,randomModel());});world.append(e)});const plane=document.querySelector('.plane');let planeTimer;function schedulePlane(){clearTimeout(planeTimer);planeTimer=setTimeout(flyPlane,(480+Math.random()*420)*1000)}function flyPlane(){if(document.hidden){schedulePlane();return}plane.classList.remove('flying');void plane.offsetWidth;plane.classList.add('flying')}plane.addEventListener('animationend',()=>{plane.classList.remove('flying');schedulePlane()});document.querySelector('#plane').onclick=()=>{clearTimeout(planeTimer);flyPlane()};document.addEventListener('visibilitychange',()=>{plane.style.animationPlayState=document.hidden?'paused':''});schedulePlane();</script></html>
