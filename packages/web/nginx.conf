server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /achievements {
    try_files /index.html =404;
  }

  location = /achievements/ {
    try_files /index.html =404;
  }

  location = /inventory {
    try_files /index.html =404;
  }

  location = /inventory/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Change the versioned filename whenever a game thumbnail changes.
  location ^~ /bar/game-thumbnails/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Versioned bar artwork is immutable; the PWA caches only requested images.
  location ^~ /bar/city-v4/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /bar/city-v5/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(?!assets/).+\.(avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
