<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ДТП на карте · локальная проверка</title><style>body{margin:0;background:#132131;color:#eef5ff;font:14px system-ui}header{padding:12px}h1{font-size:20px;margin:0 0 6px}button{margin:6px 5px 0 0;padding:7px 10px}.viewport{height:calc(100dvh - 160px);min-height:440px;overflow:auto hidden}.world{position:relative;height:100%;min-width:1320px;width:calc((100dvh - 160px)*3);overflow:hidden}.map{display:block;width:100%;height:100%}#root{position:absolute;inset:0;pointer-events:none}</style><header><h1>ДТП на верхней дороге</h1><div>Локальная проверка. В автоматическом просмотре ожидания сокращены до 5 секунд вместо 5–10 минут.</div><div id="controls"></div></header><div class="viewport"><div class="world"><img class="map" src="/maps/city-day-4096-76504717105e.webp"><div id="root"></div></div></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{CityTraffic}from'/src/city/CityTraffic.tsx';import{CityAccident}from'/src/city/CityAccident.tsx';import{createAccident}from'/src/city/accident.ts';
const root=createRoot(document.getElementById('root'));let sequence=0;const viewport=document.querySelector('.viewport');
function show(phase){const now=Date.now(),event=createAccident(now-1000000,()=>.4,true);let time=now;if(phase==='approach')time=event.start+(event.collisionAt-event.start)*.7;if(phase==='waiting')time=event.collisionAt+100;if(phase==='police-approach')time=event.policeStart+(event.policeArrived-event.policeStart)*.7;if(phase==='police-wait')time=event.policeArrived+100;if(phase==='departing')time=event.departAt+100;root.render(React.createElement('div',{className:'city-traffic'},React.createElement(CityAccident,{incident:{event,phase,sampledAt:time},key:++sequence})));viewport.scrollLeft=viewport.firstElementChild.clientWidth*event.impact/100-viewport.clientWidth/2}
for(const [phase,label]of[['approach','Сближение'],['waiting','После удара'],['police-approach','Приезд полиции'],['police-wait','Оформление'],['departing','Разъезд'],['auto','Проиграть всё']]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>{if(phase==='auto'){root.render(React.createElement(CityTraffic,{night:false,accidentPreview:true,key:++sequence}));viewport.scrollLeft=(viewport.firstElementChild.clientWidth-viewport.clientWidth)/2}else show(phase)};document.getElementById('controls').append(button)}show('police-wait');
</script></html>
