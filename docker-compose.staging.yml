services:
  postgres-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_POSTGRES_DB}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${STAGING_POSTGRES_USER} -d ${STAGING_POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  server-dev:
    image: ghcr.io/inbotwetrust/hockey-server:${STAGING_IMAGE_TAG:-dev-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${STAGING_LOG_LEVEL:-info}
      DATABASE_URL: ${STAGING_DATABASE_URL}
      REDIS_URL: ${STAGING_REDIS_URL}
      JWT_SECRET: ${STAGING_JWT_SECRET}
      REFRESH_SECRET: ${STAGING_REFRESH_SECRET}
      TELEGRAM_BOT_TOKEN: ${STAGING_TELEGRAM_BOT_TOKEN:-dev-code-login-only}
      DAILY_SEED_SECRET: ${STAGING_DAILY_SEED_SECRET}
      VK_APP_ID: ${STAGING_VK_APP_ID:-54571497}
      DEV_ACCESS_CODE_LOGIN_ENABLED: true
      SYSTEM_USER_ID: ${STAGING_SYSTEM_USER_ID:-00000000-0000-4000-8000-000000000099}
      PUSH_VAPID_PUBLIC_KEY: ${STAGING_PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${STAGING_PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${STAGING_PUSH_VAPID_SUBJECT:-mailto:push@dev.hockey.inbotwetrust.ru}
      PUSH_SCHEDULER_ENABLED: ${STAGING_PUSH_SCHEDULER_ENABLED:-false}
      PUSH_WORKER_ENABLED: ${STAGING_PUSH_WORKER_ENABLED:-false}
      PUSH_WORKER_CONCURRENCY: ${STAGING_PUSH_WORKER_CONCURRENCY:-5}
      PUSH_WORKER_BATCH_SIZE: ${STAGING_PUSH_WORKER_BATCH_SIZE:-50}
      OBJECT_STORAGE_ENDPOINT: ${STAGING_OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${STAGING_OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_BUCKET: ${STAGING_OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_TENANT_ID: ${STAGING_OBJECT_STORAGE_TENANT_ID:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${STAGING_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${STAGING_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${STAGING_OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${STAGING_OBJECT_STORAGE_MAX_UPLOAD_BYTES:-26214400}
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy

  push-worker-dev:
    image: ghcr.io/inbotwetrust/hockey-server:${STAGING_IMAGE_TAG:-dev-latest}
    restart: unless-stopped
    command: ['node', 'packages/server/dist/push/worker-cli.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${STAGING_LOG_LEVEL:-info}
      DATABASE_URL: ${STAGING_DATABASE_URL}
      REDIS_URL: ${STAGING_REDIS_URL}
      JWT_SECRET: ${STAGING_JWT_SECRET}
      REFRESH_SECRET: ${STAGING_REFRESH_SECRET}
      TELEGRAM_BOT_TOKEN: ${STAGING_TELEGRAM_BOT_TOKEN:-dev-code-login-only}
      DAILY_SEED_SECRET: ${STAGING_DAILY_SEED_SECRET}
      VK_APP_ID: ${STAGING_VK_APP_ID:-54571497}
      DEV_ACCESS_CODE_LOGIN_ENABLED: true
      PUSH_VAPID_PUBLIC_KEY: ${STAGING_PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${STAGING_PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${STAGING_PUSH_VAPID_SUBJECT:-mailto:push@dev.hockey.inbotwetrust.ru}
      PUSH_WORKER_CONCURRENCY: ${STAGING_PUSH_WORKER_CONCURRENCY:-5}
      PUSH_WORKER_BATCH_SIZE: ${STAGING_PUSH_WORKER_BATCH_SIZE:-50}
    healthcheck:
      disable: true
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy

  web-dev:
    image: ghcr.io/inbotwetrust/hockey-web:${STAGING_IMAGE_TAG:-dev-latest}
    restart: unless-stopped

volumes:
  postgres-dev-data:
  redis-dev-data:
