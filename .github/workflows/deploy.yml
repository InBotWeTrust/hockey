name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      grant_existing_inventory:
        description: 'Grant one starter inventory package set to users currently in production'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SERVER_IMAGE: ghcr.io/inbotwetrust/hockey-server
  WEB_IMAGE: ghcr.io/inbotwetrust/hockey-web
  APP_DOMAIN: ultimatehockey.ru
  LEGACY_APP_DOMAIN: hockey.inbotwetrust.ru
  WWW_APP_DOMAIN: www.ultimatehockey.ru
  HEALTH_URL: https://ultimatehockey.ru/api/health
  LEGACY_URL: https://hockey.inbotwetrust.ru

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push web image
        uses: docker/build-push-action@v5
        env:
          BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VK_APP_ID: ${{ vars.VITE_VK_APP_ID || '54571497' }}
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          build-args: |
            VITE_TELEGRAM_BOT_USERNAME=${{ env.BOT_USERNAME }}
            VITE_VK_APP_ID=${{ env.VK_APP_ID }}
            APP_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload compose and Caddy config
        env:
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.yml Caddyfile \
            "${USER}@${HOST}:${REMOTE_PATH}/"

      - name: Pull images and restart services on VPS
        env:
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          LEGACY_APP_DOMAIN: ${{ env.LEGACY_APP_DOMAIN }}
          WWW_APP_DOMAIN: ${{ env.WWW_APP_DOMAIN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          SYSTEM_CHAT_NAME: ${{ vars.SYSTEM_CHAT_NAME }}
          PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_SUBJECT: ${{ vars.PUSH_VAPID_SUBJECT || 'mailto:push@ultimatehockey.ru' }}
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_TENANT_ID: ${{ secrets.OBJECT_STORAGE_TENANT_ID }}
          OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          OBJECT_STORAGE_PUBLIC_BASE_URL: ${{ secrets.OBJECT_STORAGE_PUBLIC_BASE_URL }}
          OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${{ vars.OBJECT_STORAGE_MAX_UPLOAD_BYTES || '26214400' }}
          PRODUCTION_YOOKASSA_SHOP_ID: ${{ secrets.PRODUCTION_YOOKASSA_SHOP_ID }}
          PRODUCTION_YOOKASSA_SECRET_KEY: ${{ secrets.PRODUCTION_YOOKASSA_SECRET_KEY }}
          GRANT_EXISTING_INVENTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.grant_existing_inventory || 'false' }}
        run: |
          PRODUCTION_YOOKASSA_SHOP_ID_B64="$(printf '%s' "$PRODUCTION_YOOKASSA_SHOP_ID" | base64 | tr -d '\r\n')"
          PRODUCTION_YOOKASSA_SECRET_KEY_B64="$(printf '%s' "$PRODUCTION_YOOKASSA_SECRET_KEY" | base64 | tr -d '\r\n')"
          unset PRODUCTION_YOOKASSA_SHOP_ID PRODUCTION_YOOKASSA_SECRET_KEY
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            IMAGE_TAG="$IMAGE_TAG" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            REMOTE_PATH="$REMOTE_PATH" \
            APP_DOMAIN="$APP_DOMAIN" \
            LEGACY_APP_DOMAIN="$LEGACY_APP_DOMAIN" \
            WWW_APP_DOMAIN="$WWW_APP_DOMAIN" \
            SYSTEM_USER_ID="$SYSTEM_USER_ID" \
            SYSTEM_CHAT_NAME="$SYSTEM_CHAT_NAME" \
            PUSH_VAPID_PUBLIC_KEY="$PUSH_VAPID_PUBLIC_KEY" \
            PUSH_VAPID_PRIVATE_KEY="$PUSH_VAPID_PRIVATE_KEY" \
            PUSH_VAPID_SUBJECT="$PUSH_VAPID_SUBJECT" \
            OBJECT_STORAGE_ENDPOINT="$OBJECT_STORAGE_ENDPOINT" \
            OBJECT_STORAGE_REGION="$OBJECT_STORAGE_REGION" \
            OBJECT_STORAGE_BUCKET="$OBJECT_STORAGE_BUCKET" \
            OBJECT_STORAGE_TENANT_ID="$OBJECT_STORAGE_TENANT_ID" \
            OBJECT_STORAGE_ACCESS_KEY_ID="$OBJECT_STORAGE_ACCESS_KEY_ID" \
            OBJECT_STORAGE_SECRET_ACCESS_KEY="$OBJECT_STORAGE_SECRET_ACCESS_KEY" \
            OBJECT_STORAGE_PUBLIC_BASE_URL="$OBJECT_STORAGE_PUBLIC_BASE_URL" \
            OBJECT_STORAGE_MAX_UPLOAD_BYTES="$OBJECT_STORAGE_MAX_UPLOAD_BYTES" \
            PRODUCTION_YOOKASSA_SHOP_ID_B64="$PRODUCTION_YOOKASSA_SHOP_ID_B64" \
            PRODUCTION_YOOKASSA_SECRET_KEY_B64="$PRODUCTION_YOOKASSA_SECRET_KEY_B64" \
            GRANT_EXISTING_INVENTORY="$GRANT_EXISTING_INVENTORY" \
            bash -s <<'ENDSSH'
          set -euo pipefail
          cd "$REMOTE_PATH"
          decode_production_yookassa_value() {
            local encoded="$1"
            local decoded
            local normalized
            if [ -z "$encoded" ]; then
              printf ''
              return 0
            fi
            if ! decoded="$(printf '%s' "$encoded" | base64 --decode 2>/dev/null)"; then
              return 1
            fi
            if [ -z "$decoded" ] || [[ "$decoded" == *$'\n'* || "$decoded" == *$'\r'* ]]; then
              return 1
            fi
            normalized="$(printf '%s' "$decoded" | base64 | tr -d '\r\n')"
            if [ "$encoded" != "$normalized" ]; then
              return 1
            fi
            printf '%s' "$decoded"
          }
          if ! PRODUCTION_YOOKASSA_SHOP_ID="$(decode_production_yookassa_value "$PRODUCTION_YOOKASSA_SHOP_ID_B64")"; then
            echo "PRODUCTION_YOOKASSA_SHOP_ID is not valid canonical base64"
            exit 1
          fi
          if ! PRODUCTION_YOOKASSA_SECRET_KEY="$(decode_production_yookassa_value "$PRODUCTION_YOOKASSA_SECRET_KEY_B64")"; then
            echo "PRODUCTION_YOOKASSA_SECRET_KEY is not valid canonical base64"
            exit 1
          fi
          unset PRODUCTION_YOOKASSA_SHOP_ID_B64 PRODUCTION_YOOKASSA_SECRET_KEY_B64
          if [ -z "$PRODUCTION_YOOKASSA_SHOP_ID" ] && [ -z "$PRODUCTION_YOOKASSA_SECRET_KEY" ]; then
            PRODUCTION_YOOKASSA_RETURN_URL=''
          elif [ -z "$PRODUCTION_YOOKASSA_SHOP_ID" ] || [ -z "$PRODUCTION_YOOKASSA_SECRET_KEY" ]; then
            echo "PRODUCTION_YOOKASSA_SHOP_ID and PRODUCTION_YOOKASSA_SECRET_KEY must both be set or both be empty"
            exit 1
          else
            PRODUCTION_YOOKASSA_RETURN_URL='https://ultimatehockey.ru/inventory?tab=bank&payment=return'
          fi
          if [ -z "${PUSH_VAPID_PUBLIC_KEY:-}" ] || [ -z "${PUSH_VAPID_PRIVATE_KEY:-}" ]; then
            echo "PUSH_VAPID_PUBLIC_KEY and PUSH_VAPID_PRIVATE_KEY GitHub secrets are required for production push notifications"
            exit 1
          fi
          for name in \
            OBJECT_STORAGE_ENDPOINT \
            OBJECT_STORAGE_REGION \
            OBJECT_STORAGE_BUCKET \
            OBJECT_STORAGE_TENANT_ID \
            OBJECT_STORAGE_ACCESS_KEY_ID \
            OBJECT_STORAGE_SECRET_ACCESS_KEY \
            OBJECT_STORAGE_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "$name GitHub secret is required for production object storage"
              exit 1
            fi
          done
          docker_login_ghcr() {
            # VPS occasionally flaps its IPv6 route to ghcr.io so the first
            # `docker login` times out. Retry with a short backoff before failing.
            for i in 1 2 3 4 5; do
              if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
                return 0
              fi
              [ "$i" = 5 ] && echo "docker login failed after 5 attempts" && return 1
              echo "docker login attempt $i failed, retry in 10s..."
              sleep 10
            done
          }

          docker_login_ghcr
          export APP_DOMAIN LEGACY_APP_DOMAIN WWW_APP_DOMAIN
          export IMAGE_TAG PUSH_VAPID_PUBLIC_KEY PUSH_VAPID_PRIVATE_KEY PUSH_VAPID_SUBJECT
          export OBJECT_STORAGE_ENDPOINT OBJECT_STORAGE_REGION OBJECT_STORAGE_BUCKET
          export OBJECT_STORAGE_TENANT_ID OBJECT_STORAGE_ACCESS_KEY_ID
          export OBJECT_STORAGE_SECRET_ACCESS_KEY OBJECT_STORAGE_PUBLIC_BASE_URL
          export OBJECT_STORAGE_MAX_UPLOAD_BYTES
          export PRODUCTION_YOOKASSA_SHOP_ID PRODUCTION_YOOKASSA_SECRET_KEY
          export PRODUCTION_YOOKASSA_RETURN_URL
          # Same flap can drop `compose pull` mid-transfer; retry a few times.
          for i in 1 2 3; do
            # Re-login before each pull attempt: after a partial failed pull,
            # Docker can leave GHCR auth in a bad state and the next pull gets
            # `unauthorized` even though the token is valid.
            docker_login_ghcr
            if docker compose pull; then
              break
            fi
            [ "$i" = 3 ] && echo "docker compose pull failed after 3 attempts" && exit 1
            echo "compose pull attempt $i failed, retry in 10s..."
            sleep 10
          done
          # `docker compose run` inherits parent stdin — our parent stdin is
          # the heredoc itself, so without `-T < /dev/null` the run step
          # consumes the rest of the script and the `up --force-recreate`
          # line silently never executes. Manifests as prod stuck on the
          # previous IMAGE_TAG while Actions reports success.
          docker compose run --rm -T server node packages/server/dist/db/migrate-cli.js < /dev/null
          if [ "$GRANT_EXISTING_INVENTORY" = "true" ]; then
            docker compose run --rm -T \
              server node packages/server/dist/ops/existingUserInventoryGrantCli.js < /dev/null
            BACKUP_DIR="$REMOTE_PATH/backups"
            BACKUP_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BACKUP_DIR"
            docker compose exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
              > "$BACKUP_DIR/inventory-grant-prod-$BACKUP_STAMP.dump"
            docker compose run --rm -T \
              -e INVENTORY_GRANT_CONFIRM=2026-09-11-existing-user-inventory-grant-v1 \
              server node packages/server/dist/ops/existingUserInventoryGrantCli.js --apply \
              < /dev/null
          fi
          # Idempotent system-channel seed: no-op if the chat already exists,
          # auto-picks the earliest user as `created_by` when SYSTEM_USER_ID
          # isn't set (the secret is optional). Failures are non-fatal so a
          # missing/empty users table doesn't block unrelated deploys.
          CHAT_NAME="${SYSTEM_CHAT_NAME:-Общий чат}"
          docker compose run --rm -T \
            -e SYSTEM_USER_ID="${SYSTEM_USER_ID:-}" \
            server node packages/server/dist/chat/seed-cli.js "$CHAT_NAME" < /dev/null \
            || echo "[deploy] chat:seed of '$CHAT_NAME' failed (non-fatal); continuing"
          # Force app containers to pick up newly pulled images.
          # Plain `up -d` was staying silent on an already-running server
          # after a new IMAGE_TAG was pulled, leaving prod on the old bundle.
          docker compose up -d --force-recreate server push-worker web caddy < /dev/null
          docker image prune -f
          docker logout ghcr.io
          ENDSSH

      - name: Smoke test
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 10 "$HEALTH_URL" | tee /dev/stderr | grep -q '"ok":true'; then
              echo "Smoke test passed on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
            [ "$i" = 5 ] && echo "Smoke test failed after 5 attempts" && exit 1
          done

          APP_URL="${HEALTH_URL%/api/health}"
          html="$(curl -fsSL --max-time 10 "$APP_URL/")"
          asset_path="$(printf '%s' "$html" | sed -n 's/.*src="\([^"]*\/assets\/index-[^"]*\.js\)".*/\1/p')"
          if [ -z "$asset_path" ]; then
            echo "Could not find web entry asset in index.html"
            exit 1
          fi
          js="$(curl -fsSL --max-time 15 "$APP_URL$asset_path")"
          printf '%s' "$html" | grep -q 'rel="manifest"'
          if printf '%s' "$html" | grep -q 'telegram.org/js/telegram-web-app'; then
            echo "Telegram Mini App script must not block regular PWA startup"
            exit 1
          fi
          printf '%s' "$js" | grep -q 'Загрузка'
          printf '%s' "$js" | grep -q 'DailyScreen-'
          echo "Frontend smoke test passed for $asset_path"

          legacy_health="$(curl -fsSL --max-time 10 "$LEGACY_URL/api/health")"
          printf '%s' "$legacy_health" | grep -q '"ok":true'
          echo "Legacy production host serves the app during phase 1"
